  background:#000;
  color:#aaa;
  border:2px inset #ccc;

  margin:20px auto 10px;

    user-select: none;

<body style="background:#CCC">
<canvas id="wasm_canvas" style="display:block;margin:0 auto" tabindex="0" onclick="window.focus(); canvas.focus();" oncontextmenu="event.preventDefault()" width="1024" height="640"></canvas>
<div id="wasm_log"></div>
<script>
const canvas = document.getElementById('wasm_canvas');
canvas.addEventListener('mousedown', ()=>{ window.focus(); canvas.focus({preventScroll:true}); });

function gate(e){
  if (document.activeElement !== canvas) e.stopImmediatePropagation();
}

['keydown','keyup','keypress'].forEach(t => {
  window.addEventListener(t, gate, true);
  document.addEventListener(t, gate, true);
});
</script>
<script>
var CWASM = {
    onStarted: function () {
        window.focus();
        document.getElementById('wasm_canvas').focus({ preventScroll: true });
    },
    print: function (msg) {
        document.getElementById('wasm_log').innerHTML += msg;
        console.log(msg);
    },
};
{{{js}}}
</script>
</body>
